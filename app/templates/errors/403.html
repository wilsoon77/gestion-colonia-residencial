{% extends 'base.html' %}

{% block title %}Acceso Denegado (403){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="text-danger mb-3">
        <i class="bi bi-shield-x display-1"></i>
    </div>
    <h1 class="display-4 fw-bold text-danger">403</h1>
    <h3 class="mb-3 fw-semibold">Acceso No Autorizado</h3>
    <p class="text-muted mb-4 fs-5">
        No tienes los permisos requeridos para acceder a esta sección del sistema.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-lg">
        <i class="bi bi-arrow-left me-2"></i>Volver al Dashboard
    </a>
</div>
{% endblock %}
